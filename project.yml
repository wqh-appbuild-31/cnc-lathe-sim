name: CNCLatheSim
options:
  bundleIdPrefix: com.wqh
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
targets:
  CNCLatheSim:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/Web/index.html
        buildPhase: resources
      - path: Resources/Web/three.min.js
        buildPhase: resources
      - path: Resources/Web/OrbitControls.js
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "2.4"
        CFBundleVersion: "6"
        CFBundleDisplayName: 数控车模拟
        CFBundleName: CNCLatheSim
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wqh.cnclathesim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.4"
        CURRENT_PROJECT_VERSION: "6"
